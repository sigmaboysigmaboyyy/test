<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper — Instant Public Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Glow FX -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- FIRST TIME NICKNAME MODAL -->
  <div id="nicknameModal" class="modal-backdrop active">
    <div class="modal-card">
      <div class="modal-header">
        <div class="brand-badge">
          <span class="brand-icon">💬</span>
          <span class="brand-name">Whisper</span>
        </div>
        <h2>Добро пожаловать!</h2>
        <p>Выберите ваш никнейм и аватар, чтобы войти в общий чат без регистрации.</p>
      </div>

      <form id="nicknameForm">
        <div class="form-group">
          <label for="modalNickname">Ваш Никнейм</label>
          <div class="input-with-action">
            <input type="text" id="modalNickname" placeholder="Например: CyberNinja" maxlength="25" required autocomplete="off">
            <button type="button" id="btnRandomNick" class="btn-secondary-action" title="Сгенерировать случайный ник">🎲 Рандом</button>
          </div>
        </div>

        <div class="form-group">
          <label>Выберите Аватар-Иконку</label>
          <div class="avatar-grid" id="avatarGrid">
            <button type="button" class="avatar-opt active" data-avatar="🚀">🚀</button>
            <button type="button" class="avatar-opt" data-avatar="🦊">🦊</button>
            <button type="button" class="avatar-opt" data-avatar="⚡">⚡</button>
            <button type="button" class="avatar-opt" data-avatar="💎">💎</button>
            <button type="button" class="avatar-opt" data-avatar="🐉">🐉</button>
            <button type="button" class="avatar-opt" data-avatar="🌙">🌙</button>
            <button type="button" class="avatar-opt" data-avatar="🐱">🐱</button>
            <button type="button" class="avatar-opt" data-avatar="👾">👾</button>
            <button type="button" class="avatar-opt" data-avatar="🎨">🎨</button>
            <button type="button" class="avatar-opt" data-avatar="🔥">🔥</button>
            <button type="button" class="avatar-opt" data-avatar="👑">👑</button>
            <button type="button" class="avatar-opt" data-avatar="🍀">🍀</button>
          </div>
        </div>

        <div class="form-group">
          <label>Цвет Аватара</label>
          <div class="color-picker-list" id="colorPickerList">
            <button type="button" class="color-opt active" data-color="#6366f1" style="background: #6366f1;"></button>
            <button type="button" class="color-opt" data-color="#ec4899" style="background: #ec4899;"></button>
            <button type="button" class="color-opt" data-color="#10b981" style="background: #10b981;"></button>
            <button type="button" class="color-opt" data-color="#f59e0b" style="background: #f59e0b;"></button>
            <button type="button" class="color-opt" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
            <button type="button" class="color-opt" data-color="#06b6d4" style="background: #06b6d4;"></button>
            <button type="button" class="color-opt" data-color="#ef4444" style="background: #ef4444;"></button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-block">Войти в Чат 🚀</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="app-wrapper">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <div class="logo-glow">💬</div>
          <span class="logo-text">Whisper</span>
          <span class="live-pill"><span class="pulse-dot"></span> LIVE</span>
        </div>
      </div>

      <div class="header-center">
        <div class="room-title">
          🌐 Общий Канал
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btnToggleSound" class="icon-btn" title="Звуковые уведомления">
          <span id="soundIcon">🔔</span>
        </button>

        <button type="button" id="btnToggleUsers" class="icon-btn mobile-only" title="Список онлайн">
          👥 <span id="onlineBadgeMobile" class="badge">0</span>
        </button>

        <div class="user-profile-badge" id="btnEditProfile" title="Нажмите чтобы сменить ник">
          <div class="avatar-circle" id="userBadgeAvatar" style="background-color: #6366f1;">🚀</div>
          <span class="user-name" id="userBadgeName">Loading...</span>
        </div>
      </div>
    </header>

    <!-- Main Layout Content -->
    <div class="app-body">
      <!-- Chat Area -->
      <main class="chat-section">
        <!-- Messages Feed -->
        <div class="messages-container" id="messagesContainer">
          <div class="messages-list" id="messagesList">
            <!-- Messages rendered via JS -->
          </div>
        </div>

        <!-- Typing Indicator Banner -->
        <div id="typingBanner" class="typing-banner hidden">
          <span class="typing-dots">
            <span>.</span><span>.</span><span>.</span>
          </span>
          <span id="typingText">Кто-то печатает...</span>
        </div>

        <!-- Image Attachment Preview Bar -->
        <div id="attachmentPreview" class="attachment-preview hidden">
          <div class="preview-card">
            <img id="previewImg" src="" alt="Attachment preview">
            <button type="button" id="btnRemoveAttachment" class="btn-remove">&times;</button>
          </div>
        </div>

        <!-- Emoji Bar Dropdown -->
        <div id="emojiPicker" class="emoji-picker-popover hidden">
          <div class="emoji-list">
            <span>😀</span><span>😂</span><span>😍</span><span>🔥</span><span>👍</span>
            <span>❤️</span><span>🎉</span><span>🚀</span><span>😎</span><span>🙌</span>
            <span>💀</span><span>🥳</span><span>✨</span><span>🤔</span><span>💯</span>
            <span>💩</span><span>👀</span><span>🤝</span><span>⚡</span><span>💩</span>
          </div>
        </div>

        <!-- Message Input Area -->
        <form id="chatForm" class="chat-input-bar">
          <input type="file" id="imageInput" accept="image/*" style="display: none;">

          <button type="button" id="btnAttachImage" class="action-btn" title="Прикрепить изображение">
            🖼️
          </button>

          <button type="button" id="btnToggleEmoji" class="action-btn" title="Вставить эмодзи">
            😀
          </button>

          <div class="input-wrapper">
            <textarea id="messageInput" placeholder="Напишите сообщение..." rows="1" maxlength="2000"></textarea>
          </div>

          <button type="submit" id="btnSend" class="send-btn" title="Отправить сообщение">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
      </main>

      <!-- Sidebar Users List -->
      <aside class="sidebar-users" id="usersSidebar">
        <div class="sidebar-header">
          <h3>Участники в сети (<span id="onlineUsersCount">0</span>)</h3>
        </div>
        <div class="users-list" id="usersList">
          <!-- Users rendered dynamically -->
        </div>
      </aside>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="profileModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Редактирование профиля</h2>
        <p>Вы можете сменить никнейм и стиль аватара в любое время.</p>
      </div>

      <form id="editProfileForm">
        <div class="form-group">
          <label for="editNickname">Новый Никнейм</label>
          <input type="text" id="editNickname" placeholder="Введите никнейм" maxlength="25" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Иконка Аватара</label>
          <div class="avatar-grid" id="editAvatarGrid">
            <!-- Rendered in JS -->
          </div>
        </div>

        <div class="form-group">
          <label>Цвет Аватара</label>
          <div class="color-picker-list" id="editColorPickerList">
            <!-- Rendered in JS -->
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnCancelEdit" class="btn-secondary">Отмена</button>
          <button type="submit" class="btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
